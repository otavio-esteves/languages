name: idiomas
x-php: &php
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: idiomas-php:dev
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /workspace/apps/platform
  volumes:
    - ..:/workspace
  env_file: ../apps/platform/.env
  environment:
    DB_HOST: db
    DB_TEST_USERNAME: idiomas_test
    DB_TEST_PASSWORD: "${DB_TEST_PASSWORD:?Execute scripts/bootstrap.sh}"
    DB_PASSWORD: "${DB_PASSWORD:?Execute scripts/bootstrap.sh}"
  depends_on:
    db:
      condition: service_healthy
services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
  worker:
    <<: *php
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
  scheduler:
    <<: *php
    command: php artisan schedule:work
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      DB_TEST_PASSWORD: "${DB_TEST_PASSWORD:?Execute scripts/bootstrap.sh}"
      POSTGRES_DB: idiomas
      POSTGRES_USER: idiomas
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Execute scripts/bootstrap.sh}"
    volumes:
      - idiomas-pg:/var/lib/postgresql
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U idiomas -d idiomas"]
      interval: 2s
      timeout: 3s
      retries: 30
  node:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/apps/platform
    volumes:
      - ..:/workspace
    environment:
      npm_config_cache: /tmp/npm-cache
    profiles: [tools]
volumes:
  idiomas-pg:
