name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local stack
        run: scripts/bootstrap.sh
      - name: PHP style and contracts/auth tests
        run: |
          scripts/compose run --rm app vendor/bin/pint --test
          scripts/compose run --rm app php artisan test
      - name: Vue checks
        run: |
          scripts/compose run --rm --no-deps node npm run test:frontend
          scripts/compose run --rm --no-deps node npm run typecheck
      - name: Stop services
        if: always()
        run: scripts/compose down
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Android build and shared contract checks
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug
